<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Orvelo">
  <defs>
    <linearGradient id="ring" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBB040"/>
      <stop offset="0.5" stop-color="#E2457A"/>
      <stop offset="1" stop-color="#6A2BB8"/>
    </linearGradient>
    <linearGradient id="orbit" x1="3" y1="0" x2="61" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE29A"/>
      <stop offset="1" stop-color="#FBB040"/>
    </linearGradient>
    <!-- lower half of the orbit in its own (rotated) space = the part in front of the ring -->
    <clipPath id="front"><rect x="0" y="32" width="64" height="32"/></clipPath>
  </defs>
  <g transform="rotate(-30 32 32)">
    <ellipse cx="32" cy="32" rx="29" ry="10" fill="none" stroke="url(#orbit)" stroke-width="3.5" opacity="0.45"/>
  </g>
  <circle cx="32" cy="32" r="14" fill="none" stroke="url(#ring)" stroke-width="7.5"/>
  <g transform="rotate(-30 32 32)">
    <ellipse cx="32" cy="32" rx="29" ry="10" fill="none" stroke="url(#orbit)" stroke-width="3.5" clip-path="url(#front)"/>
  </g>
  <circle cx="57" cy="17.5" r="5.5" fill="#FBB040"/>
</svg>
