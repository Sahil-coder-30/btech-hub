openapi: 3.1.0
info:
  title: Orvelo API
  version: 2.1.0
  description: |
    HTTP API behind the Orvelo web app (Next.js App Router route handlers under `src/app/api`,
    plus the Google OAuth routes under `src/pages/api/auth/google`).

    **Auth.** Login sets an HttpOnly `bh_session` cookie (HS256 JWT, 7 days). There are no API keys.
    Routes marked `session` need any logged-in user. Routes marked `admin` need `role = admin`.

    **Errors.** Every handler returns the faultkit envelope on failure:
    `{ "success": false, "error": { "code", "message", "details", "requestId" }, "requestId" }`.
    Validation errors (Zod) return `400` with code `VALIDATION_ERROR` and `details` as `{ field: [reasons] }`
    (object-level reasons under `_root`). Unknown errors return a generic `500` with code
    `INTERNAL_SERVER_ERROR`. The `x-request-id` response header matches `requestId` for log lookup.
    Each operation lists every error status it can return, with the exact `code`, `message` and an example body.

    | Status | Codes |
    |---|---|
    | 400 | `VALIDATION_ERROR`, `BAD_REQUEST` |
    | 401 | `UNAUTHORIZED` |
    | 403 | `FORBIDDEN` |
    | 404 | `NOT_FOUND` |
    | 405 | `METHOD_NOT_ALLOWED` |
    | 409 | `CONFLICT` |
    | 422 | `UNPROCESSABLE_ENTITY` |
    | 429 | `RATE_LIMIT_EXCEEDED` (our limiter), `MODEL_RATE_LIMIT` (AI provider quota) |
    | 500 | `INTERNAL_SERVER_ERROR` (message always generic, except a missing env var) |
    | 502 | `BAD_GATEWAY` |
    | 503 | `SERVICE_UNAVAILABLE` (a migration or a service key is missing; the message says which) |

    **Rate limits.** In-memory sliding window per user (or per IP for guests), one window per server
    instance. Exceeding it returns `429`. Limits are listed on each operation as `x-rate-limit`.

    **Streaming.** `/api/ask` and `/api/planner` stream NDJSON (one JSON object per line). Errors before
    the stream starts use the normal envelope and status. An error after it starts arrives as a last line
    `{ "type": "error", "message": "...", "status": 429 }` on an HTTP 200 response.

    **Known gaps.** The error docs describe the intended contract. These cases do not match it yet and
    fail in `npm run test:live` (tests named `bug:`) until fixed:
    - Broken JSON bodies and non-multipart uploads return `500` instead of `400 BAD_REQUEST`.
    - Database errors on bad ids return `500` instead of `400`/`404` (`DELETE /api/uploads?id=abc`,
      `POST /api/resources/save` with an unknown id, `PATCH /api/admin/resources` with an unknown id).
    - No request size limits: huge quiz, SGPA and dashboard payloads are accepted or end in `500`.
    - `POST /api/admin/resources` accepts `javascript:` links.
    - Unknown `/api/*` paths return the HTML 404 page; unsupported methods return an empty `405`.
    - The OAuth callback answers `?format=json` failures with a non-envelope `500`.
servers:
  - url: http://localhost:3000
    description: Local dev
  - url: "{baseUrl}"
    description: Production (value of NEXT_PUBLIC_APP_URL)
    variables:
      baseUrl:
        default: https://your-domain.example
security:
  - session: []
tags:
  - name: Auth
  - name: Account
  - name: Profile
  - name: AI
  - name: Planner
  - name: Quiz
  - name: Grades
  - name: Resources
  - name: Syllabus
  - name: Uploads
  - name: Memory
  - name: Admin
  - name: Public

paths:
  # ---------------- Auth ----------------
  /api/auth/google:
    get:
      tags: [Auth]
      summary: Start Google OAuth
      security: []
      parameters:
        - { name: next, in: query, schema: { type: string, example: /dashboard }, description: Local path to return to after login. }
      responses:
        "302": { description: Redirect to Google consent screen. }
  /api/auth/google/callback:
    get:
      tags: [Auth]
      summary: Google OAuth callback
      description: Creates or updates the user, sets `bh_session`, then redirects to `next` (or `/onboarding` if not onboarded).
      security: []
      responses:
        "302": { description: "Redirect into the app, or to `/login?error=callback_failed`." }
  /api/auth/admin:
    post:
      tags: [Auth]
      summary: Admin login with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Logged in. Sets `bh_session`.
          content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, redirect: { type: string, example: /admin } } } } }
        "400":
          description: |-
            - `BAD_REQUEST` "Username and password required": A field is missing or the body is not JSON.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                bad_request:
                  summary: "A field is missing or the body is not JSON."
                  value: {"success": false, "error": {"code": "BAD_REQUEST", "message": "Username and password required", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
        "401":
          description: |-
            - `UNAUTHORIZED` "Invalid admin credentials": Wrong username or password.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                unauthorized:
                  summary: "Wrong username or password."
                  value: {"success": false, "error": {"code": "UNAUTHORIZED", "message": "Invalid admin credentials", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
        "429":
          description: |-
            - `RATE_LIMIT_EXCEEDED` "Too many requests. Please wait a minute and try again.": Over the rate limit (5 per 15 minutes per IP).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                rate_limit_exceeded:
                  summary: "Over the rate limit (5 per 15 minutes per IP)."
                  value: {"success": false, "error": {"code": "RATE_LIMIT_EXCEEDED", "message": "Too many requests. Please wait a minute and try again.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
        "500":
          description: |-
            - `INTERNAL_SERVER_ERROR` "Something went wrong. Please try again.": Unexpected failure (database, network, bug). The real error is only in the server log, found by `requestId`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                internal_server_error:
                  summary: "Unexpected failure (database, network, bug). The real error is only in the server log, found by `requestId`."
                  value: {"success": false, "error": {"code": "INTERNAL_SERVER_ERROR", "message": "Something went wrong. Please try again.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Log out (clears the cookie)
      security: []
      responses:
        "200": { $ref: "#/components/responses/Ok" }
    get:
      tags: [Auth]
      summary: Log out and redirect
      security: []
      parameters:
        - { name: next, in: query, schema: { type: string, default: /login } }
      responses:
        "302": { description: Redirect to `next`. }

  # ---------------- Account ----------------
  /api/me:
    get:
      tags: [Account]
      summary: Current user (null when logged out)
      security: []
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, properties: { user: { oneOf: [{ $ref: "#/components/schemas/User" }, { type: "null" }] } } } } }
        "500":
          description: |-
            - `INTERNAL_SERVER_ERROR` "Something went wrong. Please try again.": Unexpected failure (database, network, bug). The real error is only in the server log, found by `requestId`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                internal_server_error:
                  summary: "Unexpected failure (database, network, bug). The real error is only in the server log, found by `requestId`."
                  value: {"success": false, "error": {"code": "INTERNAL_SERVER_ERROR", "message": "Something went wrong. Please try again.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
    patch:
      tags: [Account]
      summary: Set branch and year
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                branch_code: { oneOf: [{ $ref: "#/components/schemas/BranchCode" }, { type: "null" }] }
                year: { type: [integer, "null"], minimum: 1, maximum: 4 }
      responses:
        "200": { description: Updated user, content: { application/json: { schema: { type: object, properties: { user: { $ref: "#/components/schemas/User" } } } } } }
        "400":
          description: |-
            - `VALIDATION_ERROR` "Input validation failed. Please check the provided fields.": The body or query fails validation. `details` maps each field to its reasons; object-level reasons sit under `_root`.
            - `BAD_REQUEST` "Request body is not valid JSON.": The body is not parseable JSON.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                validation_error_1:
                  summary: "The body or query fails validation. `details` maps each field to its reasons; object-level reasons sit under `_root`."
                  value: {"success": false, "error": {"code": "VALIDATION_ERROR", "message": "Input validation failed. Please check the provided fields.", "details": {"branch_code": ["Invalid enum value. Expected 'CSE' | 'CSEAIML' | 'CSEDS' | 'IT' | 'ECE' | 'EE' | 'EEE' | 'ME' | 'CE', received 'XYZ'"], "year": ["Number must be less than or equal to 4"]}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
                bad_request_2:
                  summary: "The body is not parseable JSON."
                  value: {"success": false, "error": {"code": "BAD_REQUEST", "message": "Request body is not valid JSON.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
        "401":
          description: |-
            - `UNAUTHORIZED` "Please log in first.": No session cookie, or it is invalid, expired, or its user no longer exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                unauthorized:
                  summary: "No session cookie, or it is invalid, expired, or its user no longer exists."
                  value: {"success": false, "error": {"code": "UNAUTHORIZED", "message": "Please log in first.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
        "500":
          description: |-
            - `INTERNAL_SERVER_ERROR` "Something went wrong. Please try again.": Unexpected failure (database, network, bug). The real error is only in the server log, found by `requestId`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                internal_server_error:
                  summary: "Unexpected failure (database, network, bug). The real error is only in the server log, found by `requestId`."
                  value: {"success": false, "error": {"code": "INTERNAL_SERVER_ERROR", "message": "Something went wrong. Please try again.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
  /api/account:
    delete:
      tags: [Account]
      summary: Delete the account and all its data
      x-rate-limit: 5/min
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [confirmEmail], properties: { confirmEmail: { type: string, description: Must match the account email. } } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400":
          description: |-
            - `VALIDATION_ERROR` "Input validation failed. Please check the provided fields.": The body or query fails validation. `details` maps each field to its reasons; object-level reasons sit under `_root`.
            - `BAD_REQUEST` "That email does not match your account.": `confirmEmail` is not the account email.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                validation_error_1:
                  summary: "The body or query fails validation. `details` maps each field to its reasons; object-level reasons sit under `_root`."
                  value: {"success": false, "error": {"code": "VALIDATION_ERROR", "message": "Input validation failed. Please check the provided fields.", "details": {"confirmEmail": ["Required"]}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
                bad_request_2:
                  summary: "`confirmEmail` is not the account email."
                  value: {"success": false, "error": {"code": "BAD_REQUEST", "message": "That email does not match your account.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
        "401":
          description: |-
            - `UNAUTHORIZED` "Please log in first.": No session cookie, or it is invalid, expired, or its user no longer exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                unauthorized:
                  summary: "No session cookie, or it is invalid, expired, or its user no longer exists."
                  value: {"success": false, "error": {"code": "UNAUTHORIZED", "message": "Please log in first.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
        "403":
          description: |-
            - `FORBIDDEN` "Admin accounts cannot be deleted here.": The caller is an admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                forbidden:
                  summary: "The caller is an admin."
                  value: {"success": false, "error": {"code": "FORBIDDEN", "message": "Admin accounts cannot be deleted here.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
        "429":
          description: |-
            - `RATE_LIMIT_EXCEEDED` "Too many requests. Please wait a minute and try again.": Over the rate limit (5/min).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                rate_limit_exceeded:
                  summary: "Over the rate limit (5/min)."
                  value: {"success": false, "error": {"code": "RATE_LIMIT_EXCEEDED", "message": "Too many requests. Please wait a minute and try again.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
        "500":
          description: |-
            - `INTERNAL_SERVER_ERROR` "Something went wrong. Please try again.": Unexpected failure (database, network, bug). The real error is only in the server log, found by `requestId`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                internal_server_error:
                  summary: "Unexpected failure (database, network, bug). The real error is only in the server log, found by `requestId`."
                  value: {"success": false, "error": {"code": "INTERNAL_SERVER_ERROR", "message": "Something went wrong. Please try again.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
  /api/account/summary:
    get:
      tags: [Account]
      summary: Counts of stored data per type
      responses:
        "200": { $ref: "#/components/responses/Json" }
        "401":
          description: |-
            - `UNAUTHORIZED` "Please log in first.": No session cookie, or it is invalid, expired, or its user no longer exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                unauthorized:
                  summary: "No session cookie, or it is invalid, expired, or its user no longer exists."
                  value: {"success": false, "error": {"code": "UNAUTHORIZED", "message": "Please log in first.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
        "500":
          description: |-
            - `INTERNAL_SERVER_ERROR` "Something went wrong. Please try again.": Unexpected failure (database, network, bug). The real error is only in the server log, found by `requestId`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                internal_server_error:
                  summary: "Unexpected failure (database, network, bug). The real error is only in the server log, found by `requestId`."
                  value: {"success": false, "error": {"code": "INTERNAL_SERVER_ERROR", "message": "Something went wrong. Please try again.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
  /api/account/export:
    get:
      tags: [Account]
      summary: Download all of my data as JSON
      x-rate-limit: 3/min
      responses:
        "200": { description: JSON file download (Content-Disposition attachment), content: { application/json: { schema: { type: object } } } }
        "401":
          description: |-
            - `UNAUTHORIZED` "Please log in first.": No session cookie, or it is invalid, expired, or its user no longer exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                unauthorized:
                  summary: "No session cookie, or it is invalid, expired, or its user no longer exists."
                  value: {"success": false, "error": {"code": "UNAUTHORIZED", "message": "Please log in first.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
        "429":
          description: |-
            - `RATE_LIMIT_EXCEEDED` "Too many requests. Please wait a minute and try again.": Over the rate limit (3/min).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                rate_limit_exceeded:
                  summary: "Over the rate limit (3/min)."
                  value: {"success": false, "error": {"code": "RATE_LIMIT_EXCEEDED", "message": "Too many requests. Please wait a minute and try again.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
        "500":
          description: |-
            - `INTERNAL_SERVER_ERROR` "Something went wrong. Please try again.": Unexpected failure (database, network, bug). The real error is only in the server log, found by `requestId`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                internal_server_error:
                  summary: "Unexpected failure (database, network, bug). The real error is only in the server log, found by `requestId`."
                  value: {"success": false, "error": {"code": "INTERNAL_SERVER_ERROR", "message": "Something went wrong. Please try again.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
  /api/account/chats:
    delete:
      tags: [Account]
      summary: Clear Vac chat history
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, deleted: { type: integer } } } } } }
        "401":
          description: |-
            - `UNAUTHORIZED` "Please log in first.": No session cookie, or it is invalid, expired, or its user no longer exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                unauthorized:
                  summary: "No session cookie, or it is invalid, expired, or its user no longer exists."
                  value: {"success": false, "error": {"code": "UNAUTHORIZED", "message": "Please log in first.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
        "500":
          description: |-
            - `INTERNAL_SERVER_ERROR` "Something went wrong. Please try again.": Unexpected failure (database, network, bug). The real error is only in the server log, found by `requestId`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                internal_server_error:
                  summary: "Unexpected failure (database, network, bug). The real error is only in the server log, found by `requestId`."
                  value: {"success": false, "error": {"code": "INTERNAL_SERVER_ERROR", "message": "Something went wrong. Please try again.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
  /api/settings:
    get:
      tags: [Account]
      summary: Preferences and account info
      responses:
        "200": { $ref: "#/components/responses/Json" }
        "401":
          description: |-
            - `UNAUTHORIZED` "Please log in first.": No session cookie, or it is invalid, expired, or its user no longer exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                unauthorized:
                  summary: "No session cookie, or it is invalid, expired, or its user no longer exists."
                  value: {"success": false, "error": {"code": "UNAUTHORIZED", "message": "Please log in first.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
        "500":
          description: |-
            - `INTERNAL_SERVER_ERROR` "Something went wrong. Please try again.": Unexpected failure (database, network, bug). The real error is only in the server log, found by `requestId`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
