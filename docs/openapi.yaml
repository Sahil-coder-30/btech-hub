  /api/onboarding/parse:
    post:
      tags: [Profile]
      summary: Parse an AKTU One View result PDF
      x-rate-limit: 5/min
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary, description: PDF } } }
      responses:
        "200": { description: Parsed result, content: { application/json: { schema: { type: object, properties: { result: { type: object }, via: { type: string } } } } } }
        "400":
          description: |-
            - `BAD_REQUEST` "Upload your AKTU result PDF.": No `file` field, or it is empty.
            - `BAD_REQUEST` "Only PDF files are supported.": `file` is not application/pdf.
            - `BAD_REQUEST` "PDF must be under 5 MB.": `file` is over 5 MB.
            - `BAD_REQUEST` "Send the form as multipart/form-data.": The body is not multipart form data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                bad_request_1:
                  summary: "No `file` field, or it is empty."
                  value: {"success": false, "error": {"code": "BAD_REQUEST", "message": "Upload your AKTU result PDF.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
                bad_request_2:
                  summary: "`file` is not application/pdf."
                  value: {"success": false, "error": {"code": "BAD_REQUEST", "message": "Only PDF files are supported.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
                bad_request_3:
                  summary: "`file` is over 5 MB."
                  value: {"success": false, "error": {"code": "BAD_REQUEST", "message": "PDF must be under 5 MB.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
                bad_request_4:
                  summary: "The body is not multipart form data."
                  value: {"success": false, "error": {"code": "BAD_REQUEST", "message": "Send the form as multipart/form-data.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
        "401":
          description: |-
            - `UNAUTHORIZED` "Please log in first.": No session cookie, or it is invalid, expired, or its user no longer exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                unauthorized:
                  summary: "No session cookie, or it is invalid, expired, or its user no longer exists."
                  value: {"success": false, "error": {"code": "UNAUTHORIZED", "message": "Please log in first.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
        "422":
