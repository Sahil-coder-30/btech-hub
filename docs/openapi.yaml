  /api/ask:
    post:
      tags: [AI]
      summary: Ask a question about one official syllabus PDF (streams NDJSON)
      description: |
        Errors before the answer starts come back as normal JSON. After that the body is NDJSON:
        `{"type":"meta","sources":[...],"cached":bool,"query":string}`, then many
        `{"type":"delta","text":string}`, then `{"type":"done","answer":string,"grounded":bool}`
        or `{"type":"error","message":string,"status":int}`.
      x-rate-limit: 20/min
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch, year, question]
              properties:
                branch: { type: string, minLength: 2, maxLength: 10, example: CSE }
                year: { type: integer, minimum: 1, maximum: 4 }
                question: { type: string, minLength: 2, maxLength: 1000 }
                history: { type: array, maxItems: 12, items: { $ref: "#/components/schemas/ChatTurn" } }
      responses:
        "200": { description: NDJSON stream, content: { application/x-ndjson: { schema: { type: string } } } }
        "400":
          description: |-
            - `VALIDATION_ERROR` "Input validation failed. Please check the provided fields.": The body or query fails validation. `details` maps each field to its reasons; object-level reasons sit under `_root`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                validation_error:
                  summary: "The body or query fails validation. `details` maps each field to its reasons; object-level reasons sit under `_root`."
                  value: {"success": false, "error": {"code": "VALIDATION_ERROR", "message": "Input validation failed. Please check the provided fields.", "details": {"question": ["String must contain at least 2 character(s)"]}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
        "401":
          description: |-
            - `UNAUTHORIZED` "Please log in first.": No session cookie, or it is invalid, expired, or its user no longer exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                unauthorized:
                  summary: "No session cookie, or it is invalid, expired, or its user no longer exists."
                  value: {"success": false, "error": {"code": "UNAUTHORIZED", "message": "Please log in first.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
        "404":
          description: |-
            - `NOT_FOUND` "Unknown branch.": `branch` is not a known branch.
            - `NOT_FOUND` "There is no official syllabus PDF for this branch and year yet.": No syllabus link for that branch and year.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                not_found_1:
                  summary: "`branch` is not a known branch."
                  value: {"success": false, "error": {"code": "NOT_FOUND", "message": "Unknown branch.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
                not_found_2:
                  summary: "No syllabus link for that branch and year."
                  value: {"success": false, "error": {"code": "NOT_FOUND", "message": "There is no official syllabus PDF for this branch and year yet.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
        "409":
          description: |-
            - `CONFLICT` "This syllabus is not ready for questions yet.": The PDF is not indexed yet. Call /api/syllabus/prepare and poll /api/syllabus.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                conflict:
                  summary: "The PDF is not indexed yet. Call /api/syllabus/prepare and poll /api/syllabus."
                  value: {"success": false, "error": {"code": "CONFLICT", "message": "This syllabus is not ready for questions yet.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
        "429":
          description: |-
            - `RATE_LIMIT_EXCEEDED` "Too many requests. Please wait a minute and try again.": Over the rate limit (20/min).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                rate_limit_exceeded:
                  summary: "Over the rate limit (20/min)."
                  value: {"success": false, "error": {"code": "RATE_LIMIT_EXCEEDED", "message": "Too many requests. Please wait a minute and try again.", "details": null, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}, "requestId": "7f3a9c2e-1b4d-4e8f-9a6b-2c5d8e1f0a3b"}
