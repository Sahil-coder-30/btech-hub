name: Release

# Push a tag like v2.1.0 to publish a GitHub Release with that version's CHANGELOG notes.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Notes from CHANGELOG
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## \[/ { found = index($0, "[" v "]") > 0; next }
            found
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG section for $GITHUB_REF_NAME"; exit 1; }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "B.Tech Hub $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
